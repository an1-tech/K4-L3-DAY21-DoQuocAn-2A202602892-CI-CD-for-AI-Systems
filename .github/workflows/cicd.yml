name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.dvc"
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "params.yaml"
      - "requirements*.txt"
      - ".dvc/config"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:
    inputs:
      tests_only:
        description: "Run only offline tests (no AWS access required)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: income-api-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.tests_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlartifacts
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check deployment prerequisites
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is required."; exit 1; }
          test -f .dvc/config || { echo "DVC remote is not configured."; exit 1; }
          test -f data/train_batch1.csv.dvc || { echo "Training DVC pointer is missing."; exit 1; }
          test -f data/holdout.csv.dvc || { echo "Holdout DVC pointer is missing."; exit 1; }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: day21-train-${{ github.run_id }}
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import math
          import os

          with open("outputs/report.json", encoding="utf-8") as file:
              report = json.load(file)
          f1 = float(report["f1_score"])
          if not math.isfinite(f1) or not 0 <= f1 <= 1:
              raise SystemExit("Invalid f1_score in training report")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"f1={f1}\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Save model and report for Release
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            outputs/report.json
          if-no-files-found: error
      - name: Save report for comparison
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require positive-class F1 at least 0.65
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: python -m src.quality --f1 "$MODEL_F1"

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      SSH_SECURITY_GROUP_ID: ${{ vars.SSH_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check server settings before publication
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          for name in ARTIFACT_BUCKET SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_FINGERPRINT SSH_SECURITY_GROUP_ID; do
            test -n "${!name}" || { echo "$name is required."; exit 1; }
          done
      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .
      - name: Install S3 SDK
        run: python -m pip install boto3==1.43.106
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: day21-release-${{ github.run_id }}
      - name: Allow SSH only from this runner
        id: ssh_access
        run: |
          RUNNER_IP=$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)
          RUNNER_IP=$(python -c 'import ipaddress, sys; print(ipaddress.IPv4Address(sys.argv[1].strip()))' "$RUNNER_IP")
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SSH_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=day21-run-${GITHUB_RUN_ID}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          test -n "$RULE_ID" && test "$RULE_ID" != "None" || { echo "SSH rule ID was not returned."; exit 1; }
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "Temporary SSH access configured for $RUNNER_IP/32."
      - name: Verify ED25519 host key and prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          for attempt in $(seq 1 5); do
            if ssh-keyscan -T 5 -t ed25519 "$SERVER_HOST" > "$RUNNER_TEMP/income-known-hosts" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import hmac
          import os
          from pathlib import Path
          import subprocess

          known_hosts = Path(os.environ["RUNNER_TEMP"]) / "income-known-hosts"
          if not known_hosts.is_file() or not known_hosts.read_text().strip():
              raise SystemExit("Could not obtain the EC2 ED25519 host key")
          result = subprocess.check_output(
              ["ssh-keygen", "-lf", str(known_hosts), "-E", "sha256"], text=True
          )
          lines = result.strip().splitlines()
          expected = os.environ["SERVER_FINGERPRINT"].strip()
          if len(lines) != 1 or "(ED25519)" not in lines[0]:
              raise SystemExit("Expected exactly one ED25519 host key")
          actual = lines[0].split()[1]
          if not hmac.compare_digest(actual, expected):
              raise SystemExit(
                  f"ED25519 fingerprint mismatch. EC2 returned {actual}; "
                  "verify SERVER_HOST and SERVER_FINGERPRINT against the trusted EC2 session."
              )
          key = Path(os.environ["RUNNER_TEMP"]) / "income-deploy-key"
          private_key = os.environ["SERVER_SSH_KEY"].replace("\r\n", "\n").strip()
          key.write_text(private_key + "\n", encoding="utf-8")
          key.chmod(0o600)
          print("ED25519 host fingerprint verified.")
          PY
      - name: Copy serving code to EC2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i "$RUNNER_TEMP/income-deploy-key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/income-known-hosts" \
            src/serve.py "${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/src/serve.py"
      - name: Publish approved model to S3
        run: python -m scripts.upload_model
      - name: Restart API and verify health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/income-deploy-key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/income-known-hosts" \
            "${SERVER_USER}@${SERVER_HOST}" 'bash -s' <<'REMOTE'
            set -eu
            sudo -n /usr/bin/systemctl restart income-api
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/healthz; then
                echo
                echo "Health check passed."
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed."
            exit 1
          REMOTE
      - name: Remove this runner's temporary SSH rule
        if: ${{ always() && steps.ssh_access.outputs.rule_id != '' }}
        env:
          SSH_RULE_ID: ${{ steps.ssh_access.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SSH_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$SSH_RULE_ID"
